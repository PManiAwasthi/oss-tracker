name: daily-oss-scan

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST every day
  workflow_dispatch:
    inputs:
      force_discovery:
        description: "Also discover new repos by topic (normally Mondays only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oss-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_DISCOVERY: ${{ inputs.force_discovery && '1' || '0' }}
        run: python -u scan.py
      - name: Commit changes
        run: |
          git config user.name "oss-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ISSUES.md data/
          git diff --cached --quiet || git commit -m "scan: $(date -u +%Y-%m-%d)"
          git push
